name: Deepwater regression tests
on:
  push:
    branches: [research/phase10b-market-integrity]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run complete test suite
        run: python -m pytest -q
      - name: Audit real Hypixel Bazaar market IDs (diagnostic)
        id: live_audit
        continue-on-error: true
        env:
          PYTHONPATH: .
        run: python scripts/audit_live_bazaar.py
      - name: Upload Bazaar audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bazaar-market-id-audit
          path: artifacts/bazaar-market-id-audit.json
          if-no-files-found: warn
